name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  typescript-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test with coverage
        run: npm test
      - name: Build application
        run: npm run build
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/

  e2e-tests:
    runs-on: ubuntu-latest
    needs: typescript-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Install Playwright
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Run Playwright tests against Fastify
        run: cd frontend && npx playwright test

  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies and build
        run: |
          npm ci
          npm run build
      - name: Prepare isolated desktop runtime
        working-directory: desktop
        run: |
          npm ci
          npm run prepare:runtime
      - name: Package Windows application
        working-directory: desktop
        run: npx electron-builder --dir --win --x64
      - name: Validate packaged startup and PDF workflow
        run: node desktop/scripts/smoke-test.mjs release/win-unpacked/BBGDDG.exe
